<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique d'Origine — Don Alberto Café · Specialty Coffee · Boyacá Colombia</title>
<meta name="description" content="Boutique d'Origine Don Alberto — Café de spécialité directement depuis la ferme de Boyacá, Colombie.">
<link rel="icon" type="image/png" href="logos/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="da-styles.css">
<style>
.wip-section {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: calc(var(--promo-h,34px) + var(--util-h,38px) + 80px) var(--page-pad) 100px;
  background: var(--cream);
}
.wip-label {
  font-family: 'Lato', sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 28px;
}
.wip-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(52px, 8vw, 100px);
  font-weight: 300;
  color: var(--teal-deep);
  line-height: 1.1;
  margin-bottom: 32px;
}
.wip-title em { font-style: italic; color: var(--teal); }
.wip-sub {
  font-family: 'Lato', sans-serif;
  font-size: 15px;
  color: var(--mid);
  letter-spacing: 1px;
  max-width: 480px;
  line-height: 1.8;
}
.wip-divider { width: 48px; height: 1px; background: var(--gold); margin: 28px auto; }
</style>
</head>
<body class="page-origine">

<div id="site-header"></div>

<section class="wip-section">
  <div class="wip-label" id="wip-label">Boutique d'Origine</div>
  <h1 class="wip-title" id="wip-title">En <em>construction</em></h1>
  <div class="wip-divider"></div>
  <p class="wip-sub" id="wip-sub">La boutique d'origine arrive bientôt — des produits directement depuis la ferme en Boyacá.</p>
</section>

<div id="site-footer"></div>

<script src="da-shell.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var t = {
    fr: { label:'Boutique d\'Origine', title:'En <em>construction</em>', sub:'La boutique d\'origine arrive bientôt — des produits directement depuis la ferme en Boyacá.' },
    en: { label:'Origin Boutique', title:'Under <em>construction</em>', sub:'The origin boutique is coming soon — products directly from the farm in Boyacá.' },
    es: { label:'Boutique de Origen', title:'En <em>construcción</em>', sub:'La boutique de origen llega pronto — productos directamente desde la finca en Boyacá.' }
  };
  function applyWip(lang) {
    var l = t[lang] || t.fr;
    var lbl = document.getElementById('wip-label'); if(lbl) lbl.textContent = l.label;
    var ttl = document.getElementById('wip-title'); if(ttl) ttl.innerHTML = l.title;
    var sub = document.getElementById('wip-sub'); if(sub) sub.textContent = l.sub.replace(/<[^>]+>/g,'');
  }
  var orig = window.setLang;
  window.setLang = function(lang) { if(orig) orig(lang); applyWip(lang); };
  applyWip(localStorage.getItem('da_lang') || 'fr');
});
</script>
</body>
</html>
